apiVersion: carto.run/v1alpha1
kind: Workload
metadata:
  name: spring-music
  labels:
    apps.tanzu.vmware.com/workload-type: web
    apps.tanzu.vmware.com/has-tests: "true"
    apps.tanzu.vmware.com/auto-configure-actuators: "true"
    app.kubernetes.io/part-of: spring-music
spec:
  build:
    env:
    - name: BP_JVM_VERSION
      value: "17"
  params:
    - name: annotations
      value:
        autoscaling.knative.dev/minScale: "1"
  source:
    git:
      url: https://github.com/ykhadilkar/spring-music
      ref:
        branch: master
  serviceClaims:
  - name: db
    ref:
       apiVersion: v1
       kind: Secret
       name: external-mysql-db-claim
